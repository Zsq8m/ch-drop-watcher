name: drop-watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # 5分ごと（GitHubの混雑で数分遅れることあり）
  workflow_dispatch:
    inputs:
      test:
        description: "テスト通知だけ送る"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: drop-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Run
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python monitor.py --test
          else
            python monitor.py
          fi
      - name: Save state
        run: |
          git config user.name "drop-watcher"
          git config user.email "drop-watcher@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
